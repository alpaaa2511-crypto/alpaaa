let hostRetry=0,hostUp=0;
function openRoom(keep){if(!keep)code=String(1000+Math.random()*9000|0);try{peer&&peer.destroy()}catch(e){}
let p;try{p=peer=new Peer("viktorina-"+code,ICE)}catch(e){hostErr="PeerJS júklenbedi";draw();return setTimeout(()=>openRoom(keep),3000)}
const again=()=>{if(p!==peer)return;clearTimeout(p._rt);p._rt=setTimeout(()=>{if(p===peer)openRoom(1)},hostRetry++<5?2000:5000)};
p.on("open",()=>{hostErr="";hostUp=1;hostRetry=0;draw()});
p.on("disconnected",()=>{if(p!==peer||p.destroyed)return;clearTimeout(p._dt);p._dt=setTimeout(()=>{try{p.destroyed||p.reconnect()}catch(e){}},hostRetry++<5?1500:5000)});
p.on("close",again);
p.on("error",e=>{if(p!==peer)return;if(e.type==="unavailable-id"){if(!hostUp)return openRoom();hostErr="baylanıs qayta ornatılmaqta";draw();return again()}
if(e.type!=="peer-unavailable"){hostErr=e.type;draw()}if(p.destroyed)again()});
p.on("connection",c=>{c.on("open",()=>c.send(S));c.on("data",d=>onMsg(d,c))})}
const LINK=()=>location.href.split("?")[0].split("#")[0]+"?r="+code;
function onMsg(d,c){if(role!=="host"||!d||typeof d.id!=="string")return;
if(d.t==="join")return join(d,c);
if(d.t==="adm"){if(cyrb53(String(d.pw))!==PH){c.send({err:"pw"});return}
if(d.x==="hello"){aconns.set(d.id,c);c.send(S)}
else if(d.x==="start"&&S.ph==="lobby"&&S.teams.filter(t=>t.id).length>=2)startGame();
else if(d.x==="adj"&&Number.isInteger(d.i)&&d.i>=0&&d.i<S.teams.length&&(d.d===100||d.d===-100))adj(d.i,d.d);
else if(d.x==="sp")startSp();
else if(d.x==="go"&&S.ph==="ask"){S.ph="board";push()}
else if(d.x==="pause"&&S.ph!=="lobby"&&S.ph!=="end"){S.pause=S.pause?0:1;push()}
else if(d.x==="kick"&&Number.isInteger(d.i))kick(d.i);
else if(d.x==="new")newGame();
return}
if(conns.get(d.id)!==c||S.pause)return;
if(d.t==="cat")cat(d.k,d.id);
else if(d.t==="pick"&&typeof d.o==="string")pick(d.o,d.id);
else if(d.t==="steal")steal(S.teams.findIndex(t=>t.id===d.id));
else if(d.t==="spress")spPress(S.teams.findIndex(t=>t.id===d.id));
else if(d.t==="spick"&&typeof d.o==="string")spPick(d.o,d.id)}
function join(d,c){const lg=d.id.trim().slice(0,20).toLowerCase();if(!lg||typeof d.pw!=="string"||!d.pw)return c.send({err:"login"});
const h=cyrb53(lg+":"+d.pw);let i=S.teams.findIndex(t=>t.id===lg);
if(i>=0){if(AUTH[lg]!==h)return c.send({err:"login"});conns.set(lg,c);c.send(S);return}
if(S.ph!=="lobby")return c.send({err:"started"});i=S.teams.findIndex(t=>!t.id);if(i<0)return c.send({err:"full"});
AUTH[lg]=h;conns.set(lg,c);Object.assign(S.teams[i],{id:lg,n:String(d.n||"").slice(0,14)||"Komanda "+(i+1),c:ok7(d.c)});push()}
function startGame(){S.teams=S.teams.filter(t=>t.id);S.ph="board";beep(660,.25);push()}
const adj=(i,d)=>{S.teams[i].s+=d;push()};
function bye(id){const c=conns.get(id);try{c&&c.open&&c.send({kicked:1})}catch(e){}conns.delete(id);delete AUTH[id]}
function kick(i){const t=S.teams[i];if(!t)return;if(t.id)bye(t.id);
if(S.ph==="lobby"){Object.assign(t,{id:null,n:"Komanda "+(i+1),c:COL[i],s:0,st:0,sh:1});return push()}
const q=S.q;S.teams.splice(i,1);
if(S.teams.length<2){clearInterval(iv);S.q=null;S.ph="end";return push()}
if(i<S.turn)S.turn--;S.turn%=S.teams.length;
if(q&&(S.ph==="q"||S.ph==="sp")){
if(q.who===i&&!q.rev&&!q.sp){clearInterval(iv);S.q=null;S.ph="board"}
else{if(q.sp&&q.who===i)q.who=-1;else if(q.who>i)q.who--;if(q.att)q.att=q.att.filter(x=>x!==i).map(x=>x>i?x-1:x);if(q.win>i)q.win--;if(q.sp&&q.att&&q.att.length>=S.teams.length&&!q.rev)return endSp(0)}}
push()}
function newGame(){clearInterval(iv);S.teams.forEach(t=>t.id&&bye(t.id));genDD();Object.assign(S,{ph:"lobby",teams:mkTeams(),turn:0,used:Array(N).fill(0),sn:0,pause:0,q:null});push()}
function cat(k,from){if(S.ph!=="board"||S.teams[S.turn].id!==from||!Number.isInteger(k)||k<0||k>=N||S.used[k])return;const r=QS[k];
S.q={k,v:r.v,t:r.q,o:r.o.slice(),who:S.turn,stolen:0,el:0,tl:MAXT,mx:MAXT,dd:DD.includes(k)?1:0,rev:null};S.ph="q";beep(660);push();
clearInterval(iv);iv=setInterval(tick,1000)}
function tick(){const q=S.q;if(!q||q.rev)return clearInterval(iv);if(S.pause)return;q.el++;if(q.el>2){q.tl--;if(q.tl<=10&&q.tl>0)beep(880,.08)}
if(q.tl<=0)return resolve(null);E();ring(q);if(q.tl===STEAL_AT&&q.el>2)draw()}
function pick(o,from){if(S.ph!=="q"||S.q.rev||S.q.el<2||S.teams[S.q.who].id!==from)return;resolve(o)}
function steal(i){const q=S.q;if(S.ph!=="q"||!canSteal(q)||i<0||i===q.who)return;q.who=i;q.stolen=1;q.tl=20;q.mx=20;beep(520,.3);push()}
function resolve(o){clearInterval(iv);const q=S.q,t=S.teams[q.who],good=QS[q.k].o[QS[q.k].a],ok=o===good,v=q.v*(q.dd?2:1);
if(ok){t.s+=q.stolen?v*2:v;t.st++;beep(880,.3);if(t.st>=3){t.s+=100;t.st=0;q.bonus=1}}
else{t.st=0;beep(180,.4);if(t.sh){t.sh=0;q.sh=1}else t.s-=v}
q.rev=good;q.ok=ok;q.pk=o;S.used[q.k]=1;push();
setTimeout(()=>{S.turn=(S.turn+1)%S.teams.length;S.q=null;S.ph=S.used.every(x=>x)?"end":(S.turn===0&&S.sn<NAMES.length?"ask":"board");push()},3500)}

function startSp(){if(S.ph!=="ask"||S.sn>=NAMES.length)return;const k=ORD[S.sn],ws=shuffle(NAMES.map((_,i)=>i).filter(i=>i!==k)).slice(0,3);

if(q.who>=0){q.at--;if(q.at<=3&&q.at>0)beep(880,.08);
if(q.at<=0){q.att.push(q.who);q.fb=S.teams[q.who].n+": waqıt pitti";q.who=-1;if(q.att.length>=S.teams.length)return endSp(0);return push()}}
else{q.tl--;if(q.tl<=0)return endSp(0);if(q.tl<=10)beep(880,.08);if(q.tl===20)draw()}
E();ring(q)}
function spPress(i){const q=S.q;if(S.ph!=="sp"||i<0||!canSp(q,i))return;q.who=i;q.at=7;q.fb="";beep(520,.3);push()}
function spPick(o,from){const q=S.q;if(S.ph!=="sp"||!q||q.rev||q.who<0||S.teams[q.who].id!==from)return;const t=S.teams[q.who];
if(o===NAMES[q.k]){t.s+=300;q.win=q.who;q.pk=o;beep(880,.3);return endSp(1)}
t.s-=300;beep(180,.4);q.att.push(q.who);q.fb=t.n+": qáte (−300)";q.who=-1;if(q.att.length>=S.teams.length)return endSp(0);push()}
function endSp(ok){clearInterval(iv);const q=S.q;q.rev=NAMES[q.k];q.ok=ok;if(!ok)beep(180,.3);push();setTimeout(()=>{S.sn++;S.q=null;S.ph="board";push()},3500)}

function qCard(q,c){const sp=q.sp,mine=c.phone&&q.who===c.i;let st,can=false,evt="",btn="",res="";
if(sp)st=q.rev?"":q.who>=0?(mine?"🎯 Juwap beriw <b>sizde</b> — 7 sekund":`<b style="color:${ok7(S.teams[q.who].c)}">${esc(S.teams[q.who].n)}</b> juwap berip atır · 7 sekund`):q.tl>20?"«Bizde juwap bar» tuymesi 10 sekundtan keyin ashıladı":"⚡ Tuyme ashıq — birinshi basqan komanda juwap beredi";
